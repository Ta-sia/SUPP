<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SUPP</title>
</head>
<body>
    <header class="header">
        <div class="logo">SUPP</div>
        <nav class="nav">
          <button class="btn brn-login">LoggInn</button>
          <button class="btn btn-signup">SignIn</button>

    <main>
        <section class="main">
            <section class="about">
                <div class="speed">
                    <div class="container">
                        <!-- 1) Красный спидометр -->
                        <div class="circular-progress" 
                             data-value="75" 
                             data-color="#e57373">
                            <img src="IMG/heart.webp" alt="icon" class="icon" />
                        </div>
                      
                        <!-- 2) Жёлто-оранжевый спидометр -->
                        <div class="circular-progress" 
                             data-value="45" 
                             data-color="#FFC107">

                        </div>
                      
                        <!-- 3) Мягкий фиолетовый спидометр -->
                        <div class="circular-progress" 
                             data-value="30" 
                             data-color="#CE93D8">
                            <img src="https://via.placeholder.com/50/800080/FFFFFF?text=V" alt="icon" class="icon" />
                        </div>
                    </div>                                         
                </div>
                <div class="infoBox">
                     <div class="hovedText">
                        <h1>Make your's LIFE</h1>
                    </div>
                    <div class="nedText">

                    </div>

                <div class="fotoBox">

                </div>

            <section class="regular">
    
            </section>

    <footer>
        <section class="we">
